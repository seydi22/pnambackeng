# Remplace « npm start » sur la machine applicative.
# Mongo reste sur la machine donnees (MONGO_URI dans .env, deja 172.16.0.96).
# Le dossier ./uploads de cette machine est monte dans le conteneur :
# les photos survivent a un redemarrage ou a une reconstruction.

services:
  backend:
    build: .
    image: pnam-backend
    container_name: pnam-backend
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
